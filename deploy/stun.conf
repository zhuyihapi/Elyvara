# No media relay. Never replace this with the distro default TURN configuration.
stun-only
listening-port=3478
listening-ip=0.0.0.0
listening-ip=::
no-tcp
no-tls
no-dtls
no-cli
no-software-attribute
no-rfc5780
relay-threads=1
pidfile=/run/elyvara-stun/turnserver.pid
log-file=/dev/null
no-stdout-log
